<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B5998;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B3FE4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B3FE4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Abstract S with chain motif -->
  <g transform="translate(5, 5)">
    <!-- Main S shape - flowing signature-like curve -->
    <path d="M 8 40 C 8 30, 20 25, 28 22 C 36 19, 42 14, 42 8 C 42 2, 36 -2, 28 0 C 20 2, 14 8, 14 14"
          fill="none" stroke="url(#logoGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Chain link 1 (top) -->
    <ellipse cx="28" cy="4" rx="6" ry="4" fill="none" stroke="url(#chainGrad)" stroke-width="2" opacity="0.8"/>
    <!-- Chain link 2 (middle connection) -->
    <ellipse cx="28" cy="22" rx="5" ry="3.5" fill="none" stroke="url(#chainGrad)" stroke-width="2" opacity="0.9"/>
    <!-- Chain link 3 (bottom) -->
    <ellipse cx="20" cy="36" rx="6" ry="4" fill="none" stroke="url(#chainGrad)" stroke-width="2" opacity="0.8"/>
    <!-- Verification dot -->
    <circle cx="44" cy="8" r="3" fill="#10B981"/>
    <path d="M 42.5 8 L 43.5 9.2 L 46 6.5" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Text: SIGRA -->
  <text x="60" y="40" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="url(#logoGrad)" letter-spacing="-0.5">Sigra</text>
  <!-- "chain" subtitle -->
  <text x="61" y="52" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#7B3FE4" letter-spacing="3" text-transform="uppercase">CHAIN</text>
</svg>
